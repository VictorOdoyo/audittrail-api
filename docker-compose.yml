services:
  api:
    build: .
    environment:
      AUDITTRAIL_ENVIRONMENT: development
      AUDITTRAIL_DATABASE_URL: postgresql+asyncpg://audittrail:audittrail@postgres:5432/audittrail
      AUDITTRAIL_ADMIN_TOKEN: local-compose-admin-token
      AUDITTRAIL_API_KEY_PEPPER: local-compose-api-key-pepper
      AUDITTRAIL_AUTO_CREATE_SCHEMA: "true"
      AUDITTRAIL_REDIS_URL: redis://redis:6379/0
      AUDITTRAIL_EXPORT_DISPATCH_MODE: celery
      AUDITTRAIL_EXPORT_DIRECTORY: /app/exports
      AUDITTRAIL_RATE_LIMIT_ENABLED: "true"
      AUDITTRAIL_RATE_LIMIT_REQUESTS: "120"
      AUDITTRAIL_RATE_LIMIT_WINDOW_SECONDS: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - export_data:/app/exports

  worker:
    build: .
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "celery",
        "-A",
        "audittrail_api.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    environment:
      AUDITTRAIL_ENVIRONMENT: development
      AUDITTRAIL_DATABASE_URL: postgresql+asyncpg://audittrail:audittrail@postgres:5432/audittrail
      AUDITTRAIL_ADMIN_TOKEN: local-compose-admin-token
      AUDITTRAIL_API_KEY_PEPPER: local-compose-api-key-pepper
      AUDITTRAIL_REDIS_URL: redis://redis:6379/0
      AUDITTRAIL_EXPORT_DISPATCH_MODE: celery
      AUDITTRAIL_EXPORT_DIRECTORY: /app/exports
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - export_data:/app/exports

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audittrail
      POSTGRES_USER: audittrail
      POSTGRES_PASSWORD: audittrail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audittrail -d audittrail"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  export_data:
