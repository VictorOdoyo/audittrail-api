apiVersion: apps/v1
kind: Deployment
metadata:
  name: audittrail-api
  namespace: audittrail
  labels:
    app.kubernetes.io/name: audittrail-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audittrail-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audittrail-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: migrate
          image: ghcr.io/victorodoyo/audittrail-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: audittrail-config
            - secretRef:
                name: audittrail-secrets
      containers:
        - name: api
          image: ghcr.io/victorodoyo/audittrail-api:latest
          imagePullPolicy: IfNotPresent
          args: ["uvicorn", "audittrail_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: audittrail-config
            - secretRef:
                name: audittrail-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: exports
              mountPath: /var/lib/audittrail/exports
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: exports
          emptyDir: {}
        - name: tmp
          emptyDir: {}
