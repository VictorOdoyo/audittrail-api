apiVersion: apps/v1
kind: Deployment
metadata:
  name: audittrail-worker
  namespace: audittrail
  labels:
    app.kubernetes.io/name: audittrail-api
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audittrail-api
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audittrail-api
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/victorodoyo/audittrail-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-sync"]
          args:
            - celery
            - -A
            - audittrail_api.workers.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: audittrail-config
            - secretRef:
                name: audittrail-secrets
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A audittrail_api.workers.celery_app:celery_app inspect ping -d celery@$HOSTNAME --timeout=5
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 8
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: exports
              mountPath: /var/lib/audittrail/exports
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: exports
          persistentVolumeClaim:
            claimName: audittrail-exports
        - name: tmp
          emptyDir: {}
