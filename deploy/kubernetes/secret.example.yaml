apiVersion: v1
kind: Secret
metadata:
  name: audittrail-secrets
  namespace: audittrail
type: Opaque
stringData:
  AUDITTRAIL_DATABASE_URL: postgresql+asyncpg://audittrail:replace-me@postgres:5432/audittrail
  AUDITTRAIL_REDIS_URL: redis://redis:6379/0
  AUDITTRAIL_ADMIN_TOKEN: replace-with-a-long-random-management-token
  AUDITTRAIL_API_KEY_PEPPER: replace-with-a-long-random-api-key-pepper
  AUDITTRAIL_JWT_SECRET: replace-with-at-least-32-random-characters
